<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- SNS 用バナー（1200×630）の元。node scripts/make-icons.cjs で ogp.png にする -->
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f5efe3; color: #2b2620;
    display: flex; align-items: center; gap: 64px; padding: 0 80px; box-sizing: border-box;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  .icon { width: 400px; height: 400px; flex: none; border-radius: 88px; overflow: hidden; box-shadow: 0 6px 24px rgba(43,38,32,.12); }
  .icon img { width: 100%; height: 100%; display: block; }
  h1 { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 104px; letter-spacing: .16em; margin: 0 0 22px; }
  p { margin: 0; font-family: "Shippori Mincho", serif; font-weight: 500; font-size: 38px; line-height: 1.6; }
  .url { margin-top: 30px; font-family: inherit; font-size: 28px; color: #8c3b4a; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="icon"><img src="icon.svg" alt=""></div>
  <div>
    <h1>花しらべ</h1>
    <p>花を撮るだけで、<br>名前がわかる。</p>
    <p class="url">uniiqcode.com/hana-shirabe</p>
  </div>
</body>
</html>
